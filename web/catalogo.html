<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda | Qhatu Cacao</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cocoa: {
                            900: '#1a0f0a',
                            800: '#2c1810',
                            700: '#3e2218',
                        },
                        gold: {
                            300: '#f9e6b6',
                            400: '#eec075',
                            500: '#d4af37', 
                            600: '#aa8c2c',
                        },
                        cream: '#fcfbf7',
                        pdfbg: '#f4ede4', // Color crema del PDF
                        pdfred: '#a83232', // Color rojizo del precio del PDF
                    },
                    fontFamily: {
                        serif: ['"Playfair Display"', 'serif'],
                        sans: ['"Montserrat"', 'sans-serif'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 0.5s ease-out',
                        'slide-up': 'slideUp 0.6s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { transform: 'translateY(20px)', opacity: '0' },
                            '100%': { transform: 'translateY(0)', opacity: '1' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fcfbf7; }
        ::-webkit-scrollbar-thumb { background: #2c1810; border-radius: 4px; }
        
        /* Page Transition Animations */
        .transition-curtain {
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.7, 0, 0.3, 1);
        }
        .transition-curtain.active {
            transform: translateY(0%);
        }

        /* Modal Overlay blur */
        .modal-overlay {
            backdrop-filter: blur(8px);
            background-color: rgba(26, 15, 10, 0.7);
        }
    </style>
</head>
<body class="bg-white text-cocoa-900 antialiased overflow-x-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ICONS ---
        const ArrowLeft = ({ size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
        );
        const XIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
        );
        const ChevronLeft = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="15 18 9 12 15 6"></polyline></svg>
        );
        const ChevronRight = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="9 18 15 12 9 6"></polyline></svg>
        );
        const HomeIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        );
        const GridIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        );
        const MapPinIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
        );
        const ShoppingBagIcon = ({ size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path><line x1="3" y1="6" x2="21" y2="6"></line><path d="M16 10a4 4 0 0 1-8 0"></path></svg>
        );

        // --- DATA (Solo 3 productos con múltiples imágenes) ---
        const products = [
            {
                id: 1,
                name: "CHOCOLATE OSCURO 100%",
                category: "Chocolate Oscuro",
                oldPrice: "S/ 19.00",
                price: "S/ 17.00",
                description: "100 gr.",
                images: [
                    "../imagenes/negro.jpeg",
                ]
            },
            {
                id: 2,
                name: "CHOCOLATE oscuro 100%",
                category: "Chocolate oscuro",
                oldPrice: "S/ 9.50",
                price: "S/ 8.00",
                description: "50 gr",
                images: [
                    "../imagenes/bitter.jpeg",
            
                ]
            },
        ];

        // --- COMPONENTS ---

        // Transition Overlay
        const PageTransition = ({ isExiting }) => (
            <div className={`fixed inset-0 z-[100] pointer-events-none flex flex-col justify-end`}>
                <div className={`absolute inset-0 bg-cocoa-900 z-10 transition-curtain ${isExiting ? 'active' : ''} flex items-center justify-center`}>
                    <div className={`transition-all duration-500 delay-300 ${isExiting ? 'opacity-100 scale-100' : 'opacity-0 scale-90'}`}>
                        <div className="w-20 h-20 rounded-full border border-gold-500 flex items-center justify-center animate-pulse-slow">
                             <span className="font-serif text-gold-500 text-4xl font-bold">Q</span>
                        </div>
                    </div>
                </div>
            </div>
        );

        // Navbar (Dark header as requested to keep brand identity)
        const Navbar = () => {
            return (
                <>
                    <nav className="fixed top-0 w-full z-40 bg-cocoa-900 py-4 shadow-lg border-b border-gold-900">
                        <div className="container mx-auto px-6 flex justify-between items-center">
                            <a href="../web.html" className="flex items-center gap-3 cursor-pointer group">
                                 <div className="w-10 h-10 rounded-full bg-gold-500 flex items-center justify-center text-cocoa-900 font-serif font-bold text-xl shadow-lg border border-gold-300 group-hover:scale-105 transition-transform">Q</div>
                                 <span className="text-xl md:text-2xl font-serif font-bold tracking-widest text-gold-400 group-hover:text-cream transition-colors">QHATU</span>
                            </a>
                            
                            <div className="hidden md:flex items-center gap-8 font-sans text-sm tracking-widest text-cream/80">
                                <a href="../web.html" className="hover:text-gold-400 transition-colors">INICIO</a>
                                <a href="#" className="text-gold-400 font-bold transition-colors">TIENDA</a>
                                <a href="#" className="flex items-center gap-2 text-gold-400 hover:text-white transition-colors">
                                    <ShoppingBagIcon size={20} />
                                    <span className="bg-gold-500 text-cocoa-900 text-[10px] w-4 h-4 flex items-center justify-center rounded-full font-bold">0</span>
                                </a>
                            </div>
                        </div>
                    </nav>

                    {/* Bottom Navigation (Mobile Only) */}
                    <div className="md:hidden fixed bottom-0 left-0 w-full z-50 bg-cocoa-900/95 backdrop-blur-md border-t border-gold-900/50 pb-4 pt-3 px-6 shadow-[0_-5px_20px_rgba(0,0,0,0.4)]">
                        <div className="flex justify-between items-end">
                            <a href="../web.html" className="flex flex-col items-center gap-1 text-gold-400/60 hover:text-gold-400 transition-colors group">
                                <HomeIcon size={22} className="group-hover:scale-110 transition-transform"/>
                                <span className="text-[10px] font-sans tracking-widest uppercase">Inicio</span>
                            </a>
                            <a href="#" className="flex flex-col items-center gap-1 text-gold-500 transition-colors group">
                                <GridIcon size={22} className="scale-110"/>
                                <span className="text-[10px] font-sans tracking-widest uppercase font-bold">Tienda</span>
                            </a>
                            
                             <a href="#" className="flex flex-col items-center gap-1 text-gold-500 hover:text-white transition-colors relative group">
                                 <div className="bg-gold-500 text-cocoa-900 p-3 rounded-full -mt-10 shadow-[0_4px_15px_rgba(212,175,55,0.4)] border-4 border-cocoa-900 group-hover:scale-110 transition-transform relative">
                                    <ShoppingBagIcon size={24} />
                                    <span className="absolute -top-1 -right-1 bg-cocoa-900 text-gold-500 text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-gold-500">0</span>
                                </div>
                                <span className="text-[10px] font-sans tracking-widest uppercase font-bold">Cesta</span>
                            </a>
                        </div>
                    </div>
                </>
            );
        };

        // Modal Pop-up Component with Carousel
        const ProductModal = ({ product, onClose }) => {
            if (!product) return null;
            
            const [imgIndex, setImgIndex] = useState(0);

            const nextImg = () => setImgIndex((prev) => (prev + 1) % product.images.length);
            const prevImg = () => setImgIndex((prev) => (prev - 1 + product.images.length) % product.images.length);

            return (
                <div className="fixed inset-0 z-[60] flex items-center justify-center p-4 modal-overlay animate-fade-in">
                    <div className="bg-white max-w-4xl w-full rounded-sm shadow-2xl overflow-hidden flex flex-col md:flex-row relative animate-slide-up">
                        
                        {/* Close Button */}
                        <button onClick={onClose} className="absolute top-4 right-4 z-10 p-2 bg-white/80 hover:bg-gray-100 rounded-full transition-colors text-cocoa-900">
                            <XIcon size={20} />
                        </button>

                        {/* Left: Carousel */}
                        <div className="w-full md:w-1/2 relative bg-gray-100 h-64 md:h-[500px]">
                            <img 
                                src={product.images[imgIndex]} 
                                alt={product.name} 
                                className="w-full h-full object-cover"
                            />
                            
                            {/* Carousel Controls */}
                            <button onClick={prevImg} className="absolute left-2 top-1/2 -translate-y-1/2 p-2 bg-white/80 hover:bg-white rounded-full shadow-md text-cocoa-900 transition-all">
                                <ChevronLeft size={20} />
                            </button>
                            <button onClick={nextImg} className="absolute right-2 top-1/2 -translate-y-1/2 p-2 bg-white/80 hover:bg-white rounded-full shadow-md text-cocoa-900 transition-all">
                                <ChevronRight size={20} />
                            </button>

                            {/* Indicators */}
                            <div className="absolute bottom-4 left-1/2 -translate-x-1/2 flex gap-2">
                                {product.images.map((_, idx) => (
                                    <div key={idx} className={`w-2 h-2 rounded-full ${idx === imgIndex ? 'bg-cocoa-900' : 'bg-cocoa-900/30'}`}></div>
                                ))}
                            </div>
                        </div>

                        {/* Right: Details */}
                        <div className="w-full md:w-1/2 p-8 md:p-12 flex flex-col justify-center">
                            <span className="text-gray-400 text-xs font-bold tracking-widest uppercase mb-2">{product.category}</span>
                            <h2 className="text-2xl md:text-3xl font-serif text-cocoa-900 mb-4">{product.name}</h2>
                            
                            <div className="flex items-center gap-4 mb-6">
                                <span className="text-gray-400 line-through text-sm">{product.oldPrice}</span>
                                <span className="text-pdfred text-2xl font-bold font-sans">{product.price}</span>
                            </div>

                            <p className="text-gray-600 font-sans text-sm leading-relaxed mb-8">
                                {product.description}
                            </p>

                            <div className="flex flex-col gap-3 mt-auto">
                                <div className="flex items-center border border-gray-300">
                                    <button className="px-4 py-3 text-gray-500 hover:text-cocoa-900">-</button>
                                    <input type="text" value="1" className="w-full text-center font-bold text-sm outline-none" readOnly/>
                                    <button className="px-4 py-3 text-gray-500 hover:text-cocoa-900">+</button>
                                </div>
                                <button className="bg-cocoa-900 text-white py-4 font-sans font-bold uppercase tracking-widest text-xs hover:bg-gold-500 hover:text-cocoa-900 transition-colors w-full">
                                    Añadir al Carrito
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // Product Card (Rediseño limpio tipo PDF)
        const ProductCard = ({ product, index, onClick }) => (
            <div 
                className="flex flex-col cursor-pointer group animate-slide-up h-full"
                style={{animationDelay: `${index * 150}ms`}}
                onClick={() => onClick(product)}
            >
                {/* Image Container with light gray background to simulate product shot */}
                <div className="w-full aspect-[3/4] bg-[#f8f6f3] p-8 md:p-12 flex items-center justify-center relative overflow-hidden mb-4 transition-all duration-500 group-hover:bg-[#f0ece5]">
                    <img 
                        src={product.images[0]} 
                        alt={product.name} 
                        className="w-full h-full object-cover shadow-[0_10px_30px_rgba(0,0,0,0.15)] group-hover:scale-105 transition-transform duration-700" 
                    />
                    
                    {/* Hover "Ver Detalles" overlay */}
                    <div className="absolute inset-0 bg-white/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                        <span className="bg-cocoa-900 text-white px-6 py-2 text-xs font-bold uppercase tracking-widest">
                            Ver Detalles
                        </span>
                    </div>
                </div>

                {/* Details Section (Flex row like PDF) */}
                <div className="flex justify-between items-start gap-4 px-2">
                    <div className="flex flex-col text-left whitespace-nowrap">
                        <span className="text-gray-400 line-through text-xs font-sans tracking-wider">{product.oldPrice}</span>
                        <span className="text-pdfred font-bold text-sm font-sans tracking-wider">{product.price}</span>
                    </div>
                    <h3 className="text-[11px] md:text-xs text-gray-800 font-sans uppercase tracking-widest text-right leading-tight">
                        {product.name}
                    </h3>
                </div>
            </div>
        );

        const CatalogApp = () => {
            const [isExiting, setIsExiting] = useState(false);
            const [selectedProduct, setSelectedProduct] = useState(null);

            // Transiciones suaves
            useEffect(() => {
                const handleLinkClick = (e) => {
                    const link = e.target.closest('a');
                    if (link) {
                        const href = link.getAttribute('href');
                        if (!href || href.startsWith('#') || href.startsWith('javascript:')) return;
                        e.preventDefault();
                        setIsExiting(true);
                        setTimeout(() => window.location.href = href, 700); 
                    }
                };
                document.addEventListener('click', handleLinkClick);
                return () => document.removeEventListener('click', handleLinkClick);
            }, []);

            return (
                <div className="min-h-screen bg-white pb-24 md:pb-20 pt-20">
                    <PageTransition isExiting={isExiting} />
                    <Navbar />
                    
                    {/* Hero Section estilo PDF (Crema, limpio) */}
                    <div className="bg-pdfbg w-full relative py-16 md:py-24 mb-10 overflow-hidden">
                        <div className="container mx-auto px-6 flex flex-col md:flex-row items-center justify-between">
                            
                            {/* Logo Stamp */}
                            <div className="relative w-32 h-32 md:w-48 md:h-48 flex items-center justify-center mb-8 md:mb-0 z-10">
                                <svg viewBox="0 0 100 100" className="absolute w-full h-full animate-spin-slow">
                                    <path id="circlePath" d="M 50, 50 m -37, 0 a 37,37 0 1,1 74,0 a 37,37 0 1,1 -74,0" fill="transparent" />
                                    <text className="fill-cocoa-900 text-[10px] uppercase font-bold tracking-widest">
                                        <textPath xlinkHref="#circlePath">
                                            CHOCOLATE • CHOCOLATE PERUANO •
                                        </textPath>
                                    </text>
                                </svg>
                                <span className="font-serif text-5xl md:text-7xl text-cocoa-900 font-bold">Q</span>
                            </div>

                            {/* Title */}
                            <div className="text-center z-10">
                                <h1 className="font-serif text-5xl md:text-6xl text-cocoa-900">Tienda</h1>
                            </div>

                            {/* Floating Image (Decorative) */}
                            <div className="hidden md:block w-64 lg:w-80 z-10 -mr-10">
                                <img 
                                    src="../imagenes/logo.png" 
                                    className="w-full h-auto shadow-xl transform rotate-3"
                                    alt="Cacao origin" 
                                />
                            </div>
                        </div>
                    </div>

                    {/* Navbar Categorias (Texto simple como PDF) */}
                    <div className="container mx-auto px-6 mb-16">
                        <div className="flex overflow-x-auto hide-scrollbar gap-8 md:justify-center border-b border-gray-200 pb-4 text-[10px] md:text-xs font-sans font-bold tracking-widest text-gray-400 uppercase whitespace-nowrap">
                            <span className="text-cocoa-900 cursor-pointer">Chocolates</span>
                            
                        </div>
                    </div>

                    {/* Products Grid (Solo 3 productos) */}
                    <div className="container mx-auto px-6 max-w-6xl mb-20">
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-10 md:gap-16">
                            {products.map((product, index) => (
                                <ProductCard 
                                    key={product.id} 
                                    product={product} 
                                    index={index} 
                                    onClick={setSelectedProduct} 
                                />
                            ))}
                        </div>
                    </div>

                    {/* Footer Clean */}
                    <footer className="mt-12 pt-12 pb-12 md:pb-6 border-t border-gray-200 text-center bg-white">
                        <p className="text-cocoa-900 text-xs font-bold uppercase tracking-widest mb-4">Qhatu Cacao</p>
                        <p className="text-gray-400 font-sans text-[10px] uppercase tracking-wider">© 2026 Todos los derechos reservados.</p>
                    </footer>

                    {/* Modal Pop-up */}
                    {selectedProduct && (
                        <ProductModal 
                            product={selectedProduct} 
                            onClose={() => setSelectedProduct(null)} 
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<CatalogApp />);
    </script>
</body>
</html>
